apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: foss-engine-scaler
  namespace: tlsoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: foss-engine
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    restoreToOriginalReplicaCount: true
  triggers:
  # KEDA scales foss-engine based on consumer lag on the Kafka broker.
  # The broker host and port are configured in values.yaml (kafka.host, kafka.port).
  # The consumer group must match config.yaml group_id.
  # lagThreshold: number of unread messages per partition that triggers a new replica.
  # Set maxReplicaCount to match the number of Kafka topic partitions for true parallelism.
  - type: kafka
    metadata:
      bootstrapServers: "{{ .Values.kafka.host }}:{{ .Values.kafka.port }}"
      consumerGroup: "foss-soc-engine"
      topic: "summersoc"
      lagThreshold: "100"
      offsetResetPolicy: "latest"
  - type: kafka
    metadata:
      bootstrapServers: "{{ .Values.kafka.host }}:{{ .Values.kafka.port }}"
      consumerGroup: "foss-soc-engine"
      topic: "webserver"
      lagThreshold: "100"
      offsetResetPolicy: "latest"
  - type: kafka
    metadata:
      bootstrapServers: "{{ .Values.kafka.host }}:{{ .Values.kafka.port }}"
      consumerGroup: "foss-soc-engine"
      topic: "mailserver"
      lagThreshold: "100"
      offsetResetPolicy: "latest"
  - type: kafka
    metadata:
      bootstrapServers: "{{ .Values.kafka.host }}:{{ .Values.kafka.port }}"
      consumerGroup: "foss-soc-engine"
      topic: "vulnerability"
      lagThreshold: "100"
      offsetResetPolicy: "latest"
