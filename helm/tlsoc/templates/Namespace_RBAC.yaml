apiVersion: v1
kind: Namespace
metadata:
  name: tlsoc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tlsoc-admin-sa
  namespace: tlsoc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tlsoc-viewer-sa
  namespace: tlsoc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tlsoc-viewer
  namespace: tlsoc
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tlsoc-admin
  namespace: tlsoc
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tlsoc-viewer-binding
  namespace: tlsoc
subjects:
  - kind: ServiceAccount
    name: tlsoc-viewer-sa
    namespace: tlsoc
roleRef:
  kind: Role
  name: tlsoc-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tlsoc-admin-binding
  namespace: tlsoc
subjects:
  - kind: ServiceAccount
    name: tlsoc-admin-sa
    namespace: tlsoc
roleRef:
  kind: Role
  name: tlsoc-admin
  apiGroup: rbac.authorization.k8s.io
