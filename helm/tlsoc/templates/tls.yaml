# Bootstrap Self-Signed Issuer to create the Root CA
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: tlsoc-bootstrap-issuer
  namespace: tlsoc
spec:
  selfSigned: {}
---
# Generate the Root CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tlsoc-root-ca
  namespace: tlsoc
spec:
  isCA: true
  commonName: tlsoc-root-ca
  secretName: tlsoc-root-ca-secret
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: tlsoc-bootstrap-issuer
    kind: Issuer
    group: cert-manager.io
---
# The primary CA Issuer used by all SOC components to request valid certs
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: tlsoc-ca-issuer
  namespace: tlsoc
spec:
  ca:
    secretName: tlsoc-root-ca-secret
---
# Kafka Server Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-cert
  namespace: tlsoc
spec:
  secretName: kafka-tls
  duration: 2160h # 90 days
  renewBefore: 360h # Renew 15 days before expiration
  commonName: kafka.tlsoc.svc.cluster.local
  dnsNames:
  - kafka.tlsoc.svc.cluster.local
  - kafka-headless.tlsoc.svc.cluster.local
  - kafka-0.kafka-headless.tlsoc.svc.cluster.local
  - kafka
  - localhost
  issuerRef:
    name: tlsoc-ca-issuer
    kind: Issuer
---
# Kibana Ingress Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibana-cert
  namespace: tlsoc
spec:
  secretName: kibana-tls
  duration: 2160h
  renewBefore: 360h
  commonName: kibana.tlsoc.local
  dnsNames:
  - kibana.tlsoc.local
  - localhost
  issuerRef:
    name: tlsoc-ca-issuer
    kind: Issuer
---
# Logstash Client Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: logstash-cert
  namespace: tlsoc
spec:
  secretName: logstash-tls
  duration: 2160h
  renewBefore: 360h
  commonName: logstash.tlsoc.svc.cluster.local
  issuerRef:
    name: tlsoc-ca-issuer
    kind: Issuer
