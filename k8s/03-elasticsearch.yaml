apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: tlsoc
spec:
  clusterIP: None
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
    - name: transport
      port: 9300

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: tlsoc
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: tlsoc
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: sysctl
          image: busybox
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: discovery.type
              value: "single-node"
            - name: bootstrap.memory_lock
              value: "true"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "true"
            - name: xpack.security.http.ssl.key
              value: "/usr/share/elasticsearch/config/certs/elasticsearch.key"
            - name: xpack.security.http.ssl.certificate
              value: "/usr/share/elasticsearch/config/certs/elasticsearch.crt"
            - name: xpack.security.http.ssl.certificate_authorities
              value: "/usr/share/elasticsearch/config/certs/ca.crt"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tlsoc-credentials
                  key: ELASTIC_PASSWORD
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -sk -u elastic:${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health | grep -q '\"status\"'"
            failureThreshold: 30
            periodSeconds: 10
            initialDelaySeconds: 20
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -sk -u elastic:${ELASTIC_PASSWORD} 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"status\"'"
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -sk -u elastic:${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health | grep -q '\"status\"'"
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 120
          volumeMounts:
            - name: esdata
              mountPath: /usr/share/elasticsearch/data
            - name: tls-certs
              mountPath: /usr/share/elasticsearch/config/certs
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: tls-certs
          secret:
            secretName: tlsoc-tls-certs
            items:
              - key: ca.crt
                path: ca.crt
              - key: elasticsearch.crt
                path: elasticsearch.crt
              - key: elasticsearch.key
                path: elasticsearch.key
  volumeClaimTemplates:
    - metadata:
        name: esdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 10Gi
