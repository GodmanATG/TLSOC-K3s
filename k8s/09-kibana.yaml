apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: tlsoc
spec:
  selector:
    app: kibana
  ports:
    - name: https
      port: 5601
      targetPort: 5601

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: tlsoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.12
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "https://elasticsearch:9200"
            - name: ELASTICSEARCH_USERNAME
              value: "kibana_system"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tlsoc-credentials
                  key: KIBANA_PASSWORD
            - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
              value: "/usr/share/kibana/config/certs/ca.crt"
            - name: SERVER_SSL_ENABLED
              value: "true"
            - name: SERVER_SSL_CERTIFICATE
              value: "/usr/share/kibana/config/certs/kibana.crt"
            - name: SERVER_SSL_KEY
              value: "/usr/share/kibana/config/certs/kibana.key"
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: tlsoc-credentials
                  key: XPACK_ENCRYPTION_KEY
          ports:
            - containerPort: 5601
              name: https
          startupProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            failureThreshold: 20
            periodSeconds: 15
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 180
          volumeMounts:
            - name: tls-certs
              mountPath: /usr/share/kibana/config/certs/ca.crt
              subPath: ca.crt
            - name: tls-certs
              mountPath: /usr/share/kibana/config/certs/kibana.crt
              subPath: kibana.crt
            - name: tls-certs
              mountPath: /usr/share/kibana/config/certs/kibana.key
              subPath: kibana.key
      volumes:
        - name: tls-certs
          secret:
            secretName: tlsoc-tls-certs

---
# Traefik Ingress (k3s has Traefik built-in)
# For WSL/local testing: use kubectl port-forward instead
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ingress
  namespace: tlsoc
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: kibana.tlsoc.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
